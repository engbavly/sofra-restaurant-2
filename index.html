<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم سفرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div>
      <h1>سفرة</h1>
      <p>أكل مصري بيتي، بيوصلك لحد باب البيت</p>
    </div>
  </header>
  <div class="layout">
    <main>
      <nav id="tabs"></nav>
      <section id="menu"></section>
    </main>
    <aside class="cart">
      <h2>طلبك</h2>
      <ul id="cart-items"></ul>
      <p>الإجمالي: <strong id="total">0</strong> ج.م</p>
      <form id="order-form">
        <input name="name" placeholder="الاسم" required>
        <input name="phone" placeholder="رقم الموبايل" required>
        <input name="address" placeholder="العنوان" required>
        <input name="notes" placeholder="ملاحظات (اختياري)">
        <button class="btn" type="submit">ابعت الطلب</button>
      </form>
      <p id="msg"></p>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
